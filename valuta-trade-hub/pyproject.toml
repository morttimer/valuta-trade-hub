[project]
name = "valuta-trade-hub"
version = "0.1.0"
description = "Интерактивное приложение для обмена валют"
readme = "README.md"
authors = [
    { name = "kbobkov", email = "godrmortt@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
valuta-trade-hub = "valuta_trade_hub.cli.interface:run"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
